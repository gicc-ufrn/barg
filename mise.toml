# mise.toml — BARG. Contrato: lint / test / checks / ci (ver casa13-ponteio).
[tools]
# components é obrigatório: o backend rust do mise instala o toolchain mínimo, e
# sem isto `cargo clippy` falha com "'cargo-clippy' is not installed for the
# toolchain". rustfmt pelo mesmo motivo.
rust = { version = "1.90", components = "rustfmt,clippy" }
"cargo:cargo-deny" = "latest"

# Python NÃO é declarado de propósito. Os scripts em scripts/ci/ usam só a
# biblioteca padrão, e declarar a versão fazia o mise compilar CPython do zero
# no runner — três minutos e vinte, com bz2 e lzma faltando no final. O python3
# do sistema basta.

[tasks.build]
description = "Build do workspace"
run = "cargo build --workspace --all-targets"

[tasks.test]
description = "Testes do workspace"
run = "cargo test --workspace"

[tasks."lint:clippy"]
description = "Clippy sem tolerância a warning"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:fmt"]
description = "Formatação (não altera arquivos)"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Análise estática"
depends = ["lint:fmt", "lint:clippy"]

[tasks."check:sem-app"]
description = "FF-C9: nenhum crate da biblioteca depende de crate do produto"
run = "python3 scripts/ci/sem_dependencia_de_app.py"

[tasks."check:licencas"]
description = "CVE, licenças copyleft, e fonte das dependências"
run = "cargo deny check advisories bans sources licenses"

[tasks."check:sem-sintese"]
description = "ADR-0001: a biblioteca analisa, não gera som"
run = "python3 scripts/ci/sem_sintese.py"

[tasks."licencas:listar"]
description = "Lista toda licença em uso e quem a traz — para decidir com dado, não com palpite"
run = "cargo deny list"

[tasks.checks]
description = "Integridade arquitetural"
depends = ["check:sem-app", "check:sem-sintese", "check:licencas"]

[tasks.ci]
description = "O que a CI roda"
depends = ["lint", "test", "checks"]

[tasks.prepush]
description = "Verificação rápida antes do push"
depends = ["lint:fmt", "lint:clippy", "test"]
