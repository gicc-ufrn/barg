name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela execução anterior do mesmo ramo: PR de renovate empilha rápido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint + test + fronteira arquitetural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: cargo-deny
        run: cargo install --locked cargo-deny || true
      - name: mise run ci
        run: mise run ci
